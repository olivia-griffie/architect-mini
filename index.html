<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architect Mini</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="am-widget" id="architectMini">

    <!-- ── LEFT PANEL ── -->
    <div class="am-left">

      <header class="am-header">
        <div class="am-logo">
          <img src="assets/amlogo.png" alt="Architect Mini logo" class="am-logo-image" />
        </div>
      </header>

      <div class="am-design-name-bar">
        <input
          type="text"
          id="designName"
          class="am-design-name-input"
          value="Kim Business Card"
          placeholder="Design name…"
        />
        <span class="am-template-label">Standard Business Card Template</span>
      </div>

      <div class="am-zoom-bar">
        <button class="am-zoom-btn" id="zoomOut" title="Zoom out">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><line x1="13.5" y1="13.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="6" y1="9" x2="12" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="zoomSlider" min="50" max="150" value="100" class="am-zoom-slider" />
        <button class="am-zoom-btn" id="zoomIn" title="Zoom in">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><line x1="13.5" y1="13.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="6" y1="9" x2="12" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="6" x2="9" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="am-canvas-area">
        <div class="am-card-wrapper" id="cardWrapper">

          <!-- FRONT CARD -->
          <div class="am-card am-card--front" id="cardFront">
            <div class="am-card-bg">
              <img class="am-card-bg-image" src="assets/business-card-front-bg.png" alt="" aria-hidden="true" />
            </div>
            <div class="am-card-content am-card-content--front">
              <div class="am-card-front-header">
                <p class="am-card-name">
                  <strong id="previewFirstName">KIM</strong>
                  <span id="previewLastName"> LOU WAN</span>
                </p>
                <p class="am-card-title" id="previewTitle">Managing Director</p>
              </div>
              <div class="am-card-contact am-card-contact--front">
                <div class="am-card-contact-row">
                  <span id="previewEmail">info@creativedevelopers.com</span>
                </div>
                <div class="am-card-contact-row">
                  <span id="previewPhone">(987)-4575-9567</span>
                </div>
                <div class="am-card-contact-row">
                  <span id="previewWebsiteFront">www.creativedevelopers.com</span>
                </div>
                <div class="am-card-contact-row">
                  <span id="previewAddress">132 9th Street, Lakeview Lane NY 87903</span>
                </div>
              </div>
            </div>
          </div>
          <div class="am-card-label">Front Side</div>

          <!-- BACK CARD -->
          <div class="am-card am-card--back" id="cardBack">
            <div class="am-card-bg">
              <img class="am-card-bg-image" src="assets/business-card-back-bg.png" alt="" aria-hidden="true" />
            </div>
            <div class="am-card-back-content">
              <div class="am-card-back-logo" id="previewLogoBack">
                <svg class="am-logo-placeholder am-logo-placeholder--back" viewBox="0 0 60 60" fill="none">
                  <path d="M30 5 L55 30 L30 55 L5 30 Z" stroke="#00C8C8" stroke-width="2.5" fill="none"/>
                  <path d="M20 30 L30 15 L40 30 L30 45 Z" stroke="#00C8C8" stroke-width="2" fill="none"/>
                </svg>
              </div>
              <p class="am-card-back-company" id="previewBackCompany">CREATIVE DEVELOPERS</p>
              <p class="am-card-back-tagline" id="previewBackTagline">Ideas Developed By Creative Experts!</p>
              <p class="am-card-back-website" id="previewWebsite">www.creativedevelopers.com</p>
            </div>
          </div>
          <div class="am-card-label">Back Side</div>

        </div>
      </div>

      <div class="am-pagination">
        <button class="am-page-btn am-page-btn--active" data-page="1">1</button>
        <button class="am-page-btn" data-page="2">2</button>
      </div>

    </div>

    <!-- ── RIGHT PANEL ── -->
    <div class="am-right" id="amRightPanel">
      <button class="am-close-btn" id="closePanel" title="Close">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="8" x2="16" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="8" x2="8" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>

      <div class="am-form-scroll">

        <div class="am-field-group">
          <label class="am-label" for="fieldFirstName">First Name</label>
          <input class="am-input" id="fieldFirstName" type="text" placeholder="First Name" data-preview="previewFirstName" />
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldLastName">Last Name</label>
          <input class="am-input" id="fieldLastName" type="text" placeholder="Last Name" data-preview="previewLastName" />
        </div>

        <div class="am-field-group am-field-group--half">
          <label class="am-label" for="fieldTitle">Title</label>
          <input class="am-input" id="fieldTitle" type="text" placeholder="Title" data-preview="previewTitle" />
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldPhone">Phone Number</label>
          <input class="am-input" id="fieldPhone" type="tel" placeholder="(888)-888-8888" data-preview="previewPhone" />
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldEmail">Email</label>
          <input class="am-input" id="fieldEmail" type="email" placeholder="email@example.com" data-preview="previewEmail" />
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldAddress">Address</label>
          <div class="am-select-wrapper">
            <select class="am-select" id="fieldAddress" data-preview="previewAddress">
              <option value="">Select an address…</option>
              <option value="132 9th Street, Lakeview Lane NY 87903">132 9th Street, Lakeview Lane NY 87903</option>
              <option value="200 Park Ave, New York NY 10001">200 Park Ave, New York NY 10001</option>
              <option value="1 Infinite Loop, Cupertino CA 95014">1 Infinite Loop, Cupertino CA 95014</option>
              <option value="350 Fifth Ave, New York NY 10118">350 Fifth Ave, New York NY 10118</option>
              <option value="1600 Amphitheatre Pkwy, Mountain View CA 94043">1600 Amphitheatre Pkwy, Mountain View CA 94043</option>
            </select>
            <svg class="am-select-arrow" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldCompany">Company Name</label>
          <input class="am-input" id="fieldCompany" type="text" placeholder="Company Name" data-preview="previewCompany" />
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldTagline">Tagline</label>
          <input class="am-input" id="fieldTagline" type="text" placeholder="Your tagline here" data-preview="previewTagline" />
        </div>

        <div class="am-field-group">
          <label class="am-label" for="fieldWebsite">Website</label>
          <input class="am-input" id="fieldWebsite" type="text" placeholder="www.yoursite.com" data-preview="previewWebsiteFront" />
        </div>

        <div class="am-field-group">
          <label class="am-label">Logo</label>
          <label class="am-upload-btn" for="fieldLogo">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V8m0 0-3 3m3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Upload Logo</span>
            <input type="file" id="fieldLogo" accept="image/*" class="am-upload-input" />
          </label>
          <span class="am-upload-filename" id="uploadFilename"></span>
        </div>

      </div>

      <div class="am-form-actions">
        <button class="am-btn am-btn--outline" id="btnDownloadPDF">Download PDF</button>
        <button class="am-btn am-btn--primary" id="btnPreviewTab">Preview in Tab</button>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
